name: Render availability recovery

on:
  workflow_run:
    workflows: ["Render availability"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: render-availability-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.name == 'Render availability' &&
      github.event.workflow_run.path == '.github/workflows/render-availability.yml' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
      EXPECTED_DEPLOY_SHA: ${{ vars.RENDER_EXPECTED_COMMIT }}
      RELEASE_MODE: ${{ vars.RENDER_RELEASE_MODE || 'pinned' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.1"
      - name: Validate the trigger and run one bounded read-only recovery check
        run: node service/scripts/render-recovery.mjs
      - name: Record recovery limits
        if: always()
        run: |
          echo 'This recovery is one bounded retry of the failed or timed-out primary availability workflow. It performs GET-only checks, does not modify or redeploy the service, and cannot compensate for missing GitHub workflow events.' >> "$GITHUB_STEP_SUMMARY"
