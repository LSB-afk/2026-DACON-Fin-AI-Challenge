name: Render availability

on:
  workflow_dispatch:
    inputs:
      recovery_drill:
        description: "Fail this healthy monitor run to verify automatic recovery wiring"
        required: false
        type: boolean
        default: false
  schedule:
    # UTC; the checker enforces the exact 2026 KST window and buffer.
    - cron: "4-59/5 * 5-12 9 *"

permissions:
  contents: read

concurrency:
  group: render-availability
  cancel-in-progress: false

jobs:
  probe:
    # Without a public URL, skip scheduled jobs, never claim healthy.
    # A manual run with missing configuration deliberately fails.
    if: ${{ vars.RENDER_SERVICE_URL != '' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
      EXPECTED_DEPLOY_SHA: ${{ vars.RENDER_EXPECTED_COMMIT }}
      RELEASE_MODE: ${{ vars.RENDER_RELEASE_MODE || 'pinned' }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Only the trusted deployment branch can supply rolling release history.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.1"
      - name: Require a public Render origin and explicit release policy
        run: |
          node --input-type=module -e '
            const raw = process.env.RENDER_SERVICE_URL;
            let url;
            try { url = new URL(raw); } catch {}
            if (!url || url.protocol !== "https:" || !url.hostname.endsWith(".onrender.com") || url.username || url.password || url.port || url.pathname !== "/" || url.search || url.hash) {
              console.error("Set RENDER_SERVICE_URL to the deployed https://SERVICE.onrender.com origin (no credentials or path).");
              process.exit(2);
            }
            if (!["pinned", "rolling"].includes(process.env.RELEASE_MODE)) {
              console.error("RENDER_RELEASE_MODE must be pinned or rolling.");
              process.exit(2);
            }
            if (process.env.RELEASE_MODE === "pinned" && !/^[a-f0-9]{40}$/.test(process.env.EXPECTED_DEPLOY_SHA ?? "")) {
              console.error("Set RENDER_EXPECTED_COMMIT to the verified deployment full commit SHA.");
              process.exit(2);
            }
          '
      - name: Check liveness, release, homepage and AI configuration without inference
        run: |
          options=()
          if [ "$RELEASE_MODE" = "rolling" ]; then
            # Accept the healthy serving ancestor while the new build is pending.
            # This does not assert that the latest commit is already deployed.
            ALLOWED_DEPLOY_SHAS="$(git rev-list HEAD | paste -sd, -)"
            export ALLOWED_DEPLOY_SHAS
            options+=(--rolling-release)
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            options+=(--scheduled)
          fi
          node service/scripts/smoke.mjs "$RENDER_SERVICE_URL" "${options[@]}"
      - name: Trigger the requested recovery wiring drill
        id: recovery_drill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_drill == true }}
        run: |
          echo 'Synthetic monitoring recovery drill; the service was checked successfully and was not modified.' >&2
          exit 1
      - name: Record the limits of this check
        if: always()
        run: |
          if [ '${{ steps.recovery_drill.outcome }}' = 'failure' ]; then
            echo 'This failed run is an intentional recovery-wiring drill after a successful service check; it is not evidence of application downtime and did not modify the service.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'This run is a point-in-time check, not an uptime guarantee. AI configuration is checked without validating API credit or running inference. Failed runs require operator attention; scheduled runs themselves can be delayed or dropped.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$RELEASE_MODE" = "rolling" ]; then
            echo 'Rolling mode checks that the serving revision belongs to main history, not that the newest commit has finished deploying. Check Render Events and compare /api/health with the intended commit after each rollout.' >> "$GITHUB_STEP_SUMMARY"
          fi
